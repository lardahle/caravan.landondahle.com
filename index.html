<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caravan — landondahle.com</title>
<meta name="description" content="Caravan — landondahle.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0c0e12;
  --fg:#e8eaef;
  --muted:#7d8696;
  --accent:#6b9fff;
  --line:rgba(255,255,255,.08);
}
html{scroll-behavior:smooth;}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--fg);
  font-family:'DM Sans',system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:48px 24px;
  text-align:center;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse 70% 50% at 50% -30%,rgba(107,159,255,.12),transparent 50%);
  pointer-events:none;
  z-index:0;
}
main{position:relative;z-index:1;max-width:480px;}
p.k{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:.35em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:20px;
}
h1{
  font-size:clamp(28px,5vw,40px);
  font-weight:600;
  letter-spacing:-.02em;
  margin-bottom:12px;
}
h1 span{color:var(--accent);}
p.lead{
  font-size:16px;
  line-height:1.65;
  color:var(--muted);
  margin-bottom:8px;
}
p.small{
  margin-top:32px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  line-height:1.6;
}
a.fam{
  display:inline-block;
  margin-top:28px;
  padding:12px 20px;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--accent);
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  transition:background .15s,border-color .15s;
}
a.fam:hover{background:rgba(107,159,255,.08);border-color:rgba(107,159,255,.35);}
</style>
</head>
<body>
<main>
  <p class="k">landondahle.com</p>
  <h1><span>Caravan</span></h1>
  <p class="lead">Static site shell. Replace this page when you have copy, layout, or an app build to drop in.</p>
  <a class="fam" href="los-escarenos/index.html">Los Escareños — familia</a>
  <p class="small">Repo: lardahle/caravan.landondahle.com · deploy from repository root</p>
</main>
</body>
</html>
