      <div><div style="font-size:12px;font-weight:800;color:var(--red-d);margin-bottom:4px;">❌ Necesita repaso (&lt;50%)</div><div>${unknownWords.length?unknownWords.map(w=>`<span class="word-chip-sm unknown">${w}</span>`).join(''):'<span style="color:var(--text3);font-size:13px;">—</span>'}</div></div>
    </div>

    <div style="font-size:15px;font-weight:800;margin:.75rem 0;">Escritura</div>
    <div class="prog-card">
      <div style="font-size:13px;color:var(--text2);margin-bottom:.5rem;">Total calificado: ${wg.length} ejercicios</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:6px;"><div style="width:14px;height:14px;border-radius:50%;background:var(--green);"></div><span style="font-size:13px;font-weight:700;">${wgYes} legibles</span></div>
        <div style="display:flex;align-items:center;gap:6px;"><div style="width:14px;height:14px;border-radius:50%;background:var(--amber);"></div><span style="font-size:13px;font-weight:700;">${wgMaybe} algo legibles</span></div>
        <div style="display:flex;align-items:center;gap:6px;"><div style="width:14px;height:14px;border-radius:50%;background:var(--red);"></div><span style="font-size:13px;font-weight:700;">${wgNo} no legibles</span></div>
      </div>
      ${wg.length>0?`
      <div style="margin-top:1rem;">
        <div style="font-size:12px;font-weight:800;color:var(--text3);margin-bottom:6px;">HISTORIAL RECIENTE</div>
        ${wg.slice(-10).reverse().map(g=>`
          <div class="grade-item">
            <div class="grade-prompt">${g.prompt}</div>
            <div class="grade-btns">
              <span class="grade-btn ${g.grade==='yes'?'g-yes':g.grade==='maybe'?'g-maybe':'g-no'}">${g.grade==='yes'?'✅ Legible':g.grade==='maybe'?'🟡 Algo legible':'❌ No legible'}</span>
            </div>
          </div>`).join('')}
      </div>`:'' }
    </div>

    <div class="btn-row" style="margin-top:1rem;">
      <button class="btn btn-r" onclick="if(confirm('¿Borrar todos los datos de progreso?')){wordStats={};modStats={};writeGrades=[];score=0;streak=0;done=0;save();updateHUD();renderProgress();showToast('Progreso borrado');}">🗑️ Borrar progreso</button>
    </div>
  </div>
  ${MODE==='grade'?`
  <div class="card">
    <div class="card-t">📝 Calificar escritura pendiente</div>
    <div class="card-s">Pídele que escriba estos ejercicios, luego califica cada uno.</div>
    ${WRITE_WORDS.slice(0,8).map(w=>`
      <div class="grade-item">
        <div class="grade-prompt">✏️ ${w}</div>
        <div class="grade-btns">
          <button class="grade-btn g-no" onclick="gradeWrite('${w}','no');this.closest('.grade-item').style.opacity='.4'">❌</button>
          <button class="grade-btn g-maybe" onclick="gradeWrite('${w}','maybe');this.closest('.grade-item').style.opacity='.4'">🟡</button>
          <button class="grade-btn g-yes" onclick="gradeWrite('${w}','yes');this.closest('.grade-item').style.opacity='.4'">✅</button>
        </div>
      </div>`).join('')}
  </div>`:''}
  `);
}

// ── MOBILE MENU ──
function isMobile(){ return window.innerWidth<=700; }
function toggleMobileMenu(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('menu-overlay');
  const closeBtn=document.getElementById('menu-close-btn');
  if(sb.classList.contains('open')){
    sb.classList.remove('open');
    if(ov) ov.style.display='none';
    if(closeBtn) closeBtn.style.display='none';
  } else {
    sb.classList.add('open');
    if(ov) ov.style.display='block';
    if(closeBtn) closeBtn.style.display='block';
  }
}
function closeMobileMenu(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('menu-overlay');
  const closeBtn=document.getElementById('menu-close-btn');
  sb.classList.remove('open');
  if(ov) ov.style.display='none';
  if(closeBtn) closeBtn.style.display='none';
}
// Close menu when a nav item is clicked on mobile
const origGo=go;
// patch nav buttons to close menu
document.querySelectorAll('.nb').forEach(b=>{
  b.addEventListener('click',()=>closeMobileMenu());
});

updateHUD();
// Load saved media then render
(async()=>{
  await loadMediaFromIDB();
  renderHome();
  // Show welcome back message if returning user
  if(done>0) showToast('Bienvenido de nuevo. Puntos: '+score+' 🌟');
})();
</script>

      sizes: "512x512",

      purpose: "any maskable"
    }
  ],
  categories: ["health", "education", "medical"]
};
const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
const url = URL.createObjectURL(blob);
document.getElementById('pwa-manifest').href = url;

// ── SERVICE WORKER (offline support) ──
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE = 'terapia-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./'])));
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// ── INSTALL PROMPT ──
let _installPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installPrompt = e;
  const btn = document.getElementById('install-btn');
  if(btn) btn.style.display = 'inline-flex';
});
function installApp(){
  if(_installPrompt){ _installPrompt.prompt(); }
  else {
    // iOS instructions
    showToast('En iPhone: toca Compartir → "Agregar a inicio" 📲');
  }
}
</script>
