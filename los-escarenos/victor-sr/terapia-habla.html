<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Terapia del Habla">
<meta name="theme-color" content="#1D9E75">
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231D9E75'/><text y='.9em' font-size='80' x='10'>🧠</text></svg>">
<title>Terapia del Habla</title>
<style>
:root{
  /* ── APHASIA COLOUR SYSTEM ──────────────────────
     Background: warm off-white #FFFEF5 (less harsh than pure white)
     High contrast black text #111 on all backgrounds
     Action / correct: deep teal-green (not neon)
     Alert / wrong: bold orange-red (warm, attention-grabbing)
     Accent / highlight: golden-amber (guides eye, energising)
     Calm / info: soft sage-blue
     All colour pairs pass WCAG AA (4.5:1+) contrast ratio
  ─────────────────────────────────────────────── */

  /* Greens – correct, calm, confirm */
  --green:#1A8C68;--green-d:#0F5C45;--green-l:#E5F7F1;--green-deep:#0A3D2C;

  /* Reds/Oranges – wrong, stop, alert (warm, not jarring) */
  --red:#D94F2B;--red-l:#FDF0EC;--red-d:#8C2A12;

  /* Amber/Gold – highlight, primary action, engagement */
  --amber:#C97A00;--amber-l:#FFF6E0;--amber-d:#7A4500;
  --gold:#FFD835; /* bright highlight / hotspot pop colour */
  --gold-d:#B89500;

  /* Blue/Sage – calm, info, secondary */
  --blue:#2463A0;--blue-l:#EBF3FB;--blue-d:#0C2E5A;
  --sage:#4A8070;--sage-l:#E8F4F0;

  /* Purple – family/admin mode only */
  --purple:#5A3FA8;--purple-l:#EEEBFC;--purple-d:#2D1F5A;

  /* Text – maximum contrast */
  --text:#111111;--text2:#444444;--text3:#777777;

  /* Backgrounds – warm off-white, no harsh pure white */
  --bg:#FFFEF5;--bg2:#F5F3E8;--bg3:#EAE8DA;
  --bg-warm:#FFF8E6; /* pale yellow – warm engagement zone */

  /* Borders */
  --border:rgba(0,0,0,0.14);--border2:rgba(0,0,0,0.25);

  /* Layout */
  --r:12px;--rl:16px;
  --shadow:0 2px 16px rgba(0,0,0,0.10);
  --shadow-card:0 3px 20px rgba(0,0,0,0.08);
}
@media(prefers-color-scheme:dark){:root{
  --text:#F0EEE4;--text2:#B0ADA0;--text3:#666;
  --bg:#1C1B14;--bg2:#252418;--bg3:#2E2C20;
  --bg-warm:#2A2500;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.22);
  --green-l:#0A2A1E;--red-l:#2A1008;--amber-l:#2A1E00;--blue-l:#0A1A2E;
  --purple-l:#1C1630;--green-deep:#9FE1CB;--red-d:#F09580;
  --amber-d:#FAC775;--blue-d:#B0D0F0;--purple-d:#B0A8E8;--gold:#FFD835;
}}
*{box-sizing:border-box;margin:0;padding:0;}
/* Aphasia-friendly: Verdana/Arial, min 16px, 1.65 line height, left-aligned */
html,body{
  min-height:100%;
  font-family:Verdana,Arial,sans-serif;
  font-size:17px;
  line-height:1.65;
  background:var(--bg);
  color:var(--text);
  text-align:left;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}

/* Layout */
#shell{display:flex;min-height:100vh;}
#sidebar{width:218px;flex-shrink:0;background:var(--bg3);border-right:2px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
#content{flex:1;padding:1.25rem;min-width:0;}

/* Mode bar */
#modebar{background:var(--bg2);border-bottom:2px solid var(--border);padding:0.5rem 1rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.mode-tab{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;transition:all .12s;}
.mode-tab:hover{background:var(--bg3);}
.mode-tab.active{background:var(--green);color:#fff;border-color:var(--green);}
.mode-tab.fam{background:var(--purple);color:#fff;border-color:var(--purple);}

/* Sidebar */
.sb-logo{padding:.85rem 1rem;border-bottom:1px solid var(--border);}
.sb-logo h1{font-size:16px;font-weight:800;color:var(--green);}
.sb-logo p{font-size:11px;color:var(--text3);margin-top:1px;}
.sb-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:.7rem .9rem;border-bottom:1px solid var(--border);}
.sb-stat{text-align:center;background:var(--bg3);border-radius:8px;padding:6px 4px;}
.sb-stat .n{font-size:18px;font-weight:800;color:var(--amber-d);}
.sb-stat .l{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;}
.sb-sec{padding:.5rem 0;}
.sb-title{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:.3rem .85rem .2rem;}
.nb{display:flex;align-items:center;gap:8px;width:100%;padding:9px .85rem;border:none;background:none;color:var(--text2);font-size:14px;cursor:pointer;text-align:left;transition:all .12s;font-family:Verdana,Arial,sans-serif;line-height:1.5;}
.nb:hover{background:var(--bg3);color:var(--text);}
.nb.active{background:var(--amber-l);color:var(--amber-d);font-weight:700;border-left:3px solid var(--amber);}
.nb .ic{font-size:15px;width:18px;text-align:center;}
.nb .badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;background:var(--red);color:#fff;}

/* Cards */
.card{background:var(--bg);border:2px solid var(--border);border-radius:var(--rl);padding:1.4rem;margin-bottom:1.1rem;box-shadow:var(--shadow-card);}
.card-t{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:0;}
.card-s{font-size:16px;color:var(--text2);margin-bottom:1.1rem;line-height:1.6;}
.instr{padding:13px 16px;border-left:5px solid var(--amber);background:var(--amber-l);border-radius:0 var(--r) var(--r) 0;font-size:17px;font-weight:700;color:var(--amber-d);margin-bottom:1.1rem;line-height:1.65;}.instr.green{border-color:var(--green);background:var(--green-l);color:var(--green-deep);}.instr.red{border-color:var(--red);background:var(--red-l);color:var(--red-d);}
.instr.amber{border-color:var(--amber);background:var(--amber-l);color:var(--amber-d);}
.instr.red{border-color:var(--red);background:var(--red-l);color:var(--red-d);}
.instr.blue{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d);}

/* Progress bar */
.prog{background:var(--bg3);border-radius:6px;height:9px;margin-bottom:1.1rem;overflow:hidden;}
.prog-f{height:100%;background:linear-gradient(90deg,var(--amber),var(--green));border-radius:6px;transition:width .5s;}

/* Feedback */
.fb{padding:16px 20px;border-radius:var(--r);font-size:19px;font-weight:700;text-align:left;margin-bottom:1rem;display:none;animation:fadeIn .3s;line-height:1.6;border-left:6px solid;}
.fb.ok{background:#D4F5E6;color:#0A3D2C;display:block;border-left-color:var(--green);}
.fb.bad{background:#FDEAE4;color:#8C2A12;display:block;border-left-color:var(--red);}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:22px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:all .12s;white-space:nowrap;font-family:Verdana,Arial,sans-serif;}
.btn:active{transform:scale(.97);}
.btn-g{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(26,140,104,.3);}
.btn-g:hover{background:var(--green-d);box-shadow:0 4px 14px rgba(26,140,104,.4);}
.btn-r{background:var(--red);color:#fff;}
.btn-r:hover{background:var(--red-d);}
.btn-o{background:var(--bg2);color:var(--text);border:1.5px solid var(--border2);}
.btn-o:hover{background:var(--bg3);}
.btn-p{background:var(--purple);color:#fff;}
.btn-p:hover{background:var(--purple-d);}
.btn-a{background:var(--amber);color:#fff;box-shadow:0 2px 8px rgba(201,122,0,.3);}
.btn-a:hover{background:var(--amber-d);}
.btn-b{background:var(--blue);color:#fff;}
.btn-b:hover{background:var(--blue-d);}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:.9rem;}
.btn-xl{font-size:22px;padding:18px 36px;border-radius:var(--rl);}
.next-btn{display:none;margin:0 auto;padding:12px 30px;border-radius:26px;background:var(--green);color:#fff;border:none;font-size:15px;font-weight:800;cursor:pointer;transition:all .12s;}
.next-btn.show{display:block;}

/* Back button — always visible at top of content */
#back-bar{display:none;padding:.5rem 0 .25rem;margin-bottom:.5rem;}
#back-bar.show{display:flex;align-items:center;gap:10px;}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:22px;border:2px solid var(--border2);background:var(--bg-warm);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;font-family:Verdana,Arial,sans-serif;transition:all .12s;}
.back-btn:hover{background:var(--amber);color:#fff;}
#breadcrumb{font-size:14px;color:var(--text3);font-family:Verdana,Arial,sans-serif;}

.next-btn:hover{background:var(--green-d);}

/* Vocab image */
.vimg{width:150px;height:130px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:72px;background:var(--bg-warm);border:2.5px solid var(--border);cursor:pointer;transition:all .15s;user-select:none;overflow:hidden;position:relative;box-shadow:0 3px 12px rgba(0,0,0,.10);}
.vimg:hover{transform:scale(1.05);border-color:var(--amber);box-shadow:0 0 0 4px var(--gold);}
.vimg img{width:100%;height:100%;object-fit:cover;border-radius:11px;}
.vimg .edit-overlay{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:700;text-align:center;padding:4px;opacity:0;transition:opacity .2s;border-radius:0 0 11px 11px;}
.vimg:hover .edit-overlay{opacity:1;}
.pair{display:flex;flex-direction:column;align-items:center;gap:.9rem;margin-bottom:1.1rem;}
.big-w{font-size:36px;font-weight:700;text-align:left;letter-spacing:0;font-family:Verdana,Arial,sans-serif;}
.phon{font-size:15px;color:var(--text3);text-align:left;margin-top:4px;}

/* Choices */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.ch{padding:16px 14px;border-radius:var(--r);border:2.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:18px;font-weight:700;cursor:pointer;transition:all .15s;text-align:left;font-family:Verdana,Arial,sans-serif;line-height:1.5;min-height:60px;display:flex;align-items:center;}.ch:hover{background:var(--bg-warm);border-color:var(--amber);box-shadow:0 0 0 3px var(--gold);}
.ch:hover{background:var(--bg2);}
.ch.correct{background:#D4F5E6!important;border-color:var(--green)!important;border-width:3px!important;color:var(--green-deep)!important;box-shadow:0 0 0 3px rgba(26,140,104,.25)!important;}
.ch.wrong{background:#FDEAE4!important;border-color:var(--red)!important;border-width:3px!important;color:var(--red-d)!important;box-shadow:0 0 0 3px rgba(217,79,43,.2)!important;}
.ch.big{font-size:42px;padding:16px;}

/* Yes/No */
.yn-row{display:flex;gap:14px;justify-content:center;margin:1rem 0;}
.yn{padding:26px 54px;border-radius:var(--rl);font-size:30px;font-weight:700;border:3px solid;cursor:pointer;transition:all .13s;font-family:Verdana,Arial,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.12);}
.yn.si{border-color:var(--green);color:var(--green-deep);background:#D4F5E6;letter-spacing:.02em;}
.yn.no{border-color:var(--red);color:var(--red-d);background:#FDEAE4;letter-spacing:.02em;}
.yn:hover{transform:scale(1.06);}
.yn.sel-y{background:var(--green);color:#fff!important;}
.yn.sel-n{background:var(--red);color:#fff!important;}

/* Sentence builder */
.sent-built{min-height:54px;padding:9px 11px;border-radius:var(--r);border:1.5px dashed var(--border2);background:var(--bg2);display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:.9rem;}
.wchip{padding:10px 17px;border-radius:18px;background:var(--amber);color:#fff;font-size:17px;font-weight:700;cursor:pointer;font-family:Verdana,Arial,sans-serif;box-shadow:0 2px 6px rgba(201,122,0,.3);}
.wchip:hover{background:var(--green-d);}
.wpool{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:.9rem;}
.pchip{padding:9px 16px;border-radius:18px;border:2px solid var(--border2);background:var(--bg);color:var(--text);font-size:17px;font-weight:700;cursor:pointer;transition:all .13s;font-family:Verdana,Arial,sans-serif;}
.pchip:hover{background:var(--bg2);}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:1.1rem;flex-wrap:wrap;}
.tab{padding:8px 16px;border-radius:18px;border:2px solid var(--border2);background:var(--bg);color:var(--text2);font-size:15px;font-weight:700;cursor:pointer;transition:all .12s;font-family:Verdana,Arial,sans-serif;}
.tab:hover{background:var(--bg2);}
.tab.active{background:var(--green);color:#fff;border-color:var(--green);}

/* Writing canvas */
.write-area{position:relative;margin-bottom:1rem;}
#write-canvas{border-radius:var(--r);border:2px solid var(--border2);background:#fff;touch-action:none;cursor:crosshair;display:block;width:100%;}
.write-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;}
.w-label{font-size:28px;font-weight:900;text-align:center;letter-spacing:2px;padding:.75rem;background:var(--bg2);border-radius:var(--r);margin-bottom:.75rem;}

/* Comm board */
.comm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.comm-btn{padding:14px 8px;border-radius:var(--rl);border:2px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.comm-btn:hover{background:var(--amber-l);border-color:var(--amber);box-shadow:0 0 0 3px var(--gold);}
.comm-btn:active{transform:scale(.96);}
.comm-e{font-size:34px;}
.comm-w{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;}
.comm-edit-btn{position:absolute;top:3px;right:3px;font-size:10px;background:var(--bg3);border:none;border-radius:6px;padding:2px 5px;cursor:pointer;opacity:0;transition:opacity .15s;}
.comm-btn:hover .comm-edit-btn{opacity:1;}

/* Number/color grid */
.num-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.num-btn{padding:12px 6px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--bg);font-size:18px;font-weight:800;cursor:pointer;text-align:center;transition:all .13s;}
.num-btn:hover{background:var(--bg2);}

/* Pain scale */
.pain-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:1rem 0;}
.pain-btn{width:68px;height:68px;border-radius:50%;border:2.5px solid var(--border);background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:all .13s;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.pain-btn:hover{transform:scale(1.1);}
.pain-btn.sel{border-color:var(--green);background:var(--green-l);}

/* Progress dashboard */
.prog-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:1rem;margin-bottom:.75rem;}
.prog-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem;}
.prog-label{font-size:13px;font-weight:700;width:130px;flex-shrink:0;}
.prog-bar-wrap{flex:1;background:var(--bg3);border-radius:6px;height:14px;overflow:hidden;}
.prog-bar{height:100%;background:var(--green);border-radius:6px;transition:width .5s;}
.prog-bar.amber{background:var(--amber);}
.prog-bar.red{background:var(--red);}
.prog-pct{font-size:13px;font-weight:800;width:38px;text-align:right;color:var(--text2);}
.word-chip-sm{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:14px;font-size:12px;font-weight:700;margin:3px;}
.known{background:#D4F5E6;color:#0A3D2C;border:1.5px solid var(--green);}
.learning{background:var(--amber-l);color:var(--amber-d);border:1.5px solid var(--amber);}
.unknown{background:#FDEAE4;color:#8C2A12;border:1.5px solid var(--red);}

/* Grading */
.grade-item{display:flex;align-items:center;gap:.75rem;padding:.75rem;border:1px solid var(--border);border-radius:var(--r);margin-bottom:.6rem;}
.grade-prompt{font-size:20px;font-weight:900;flex:1;}
.grade-btns{display:flex;gap:6px;flex-shrink:0;}
.grade-btn{padding:6px 11px;border-radius:14px;font-size:12px;font-weight:700;border:none;cursor:pointer;transition:all .12s;}
.g-no{background:var(--red-l);color:var(--red-d);}
.g-maybe{background:var(--amber-l);color:var(--amber-d);}
.g-yes{background:var(--green-l);color:var(--green-deep);}
.g-no:hover{background:var(--red);color:#fff;}
.g-maybe:hover{background:var(--amber);color:#fff;}
.g-yes:hover{background:var(--green);color:#fff;}

/* Difficulty badge */
.diff-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;}
.diff-1{background:#E1F5EE;color:#085041;}
.diff-2{background:#FAEEDA;color:#633806;}
.diff-3{background:#FCEBEB;color:#A32D2D;}

/* Akinator word finder */
.ak-input{width:100%;padding:12px 16px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:16px;}
.ak-input:focus{outline:none;border-color:var(--green);}
.ak-result{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);margin-bottom:.6rem;cursor:pointer;transition:all .13s;}
.ak-result:hover{border-color:var(--green);background:var(--green-l);}
.ak-emoji{font-size:36px;flex-shrink:0;}
.ak-text{flex:1;}
.ak-word{font-size:18px;font-weight:800;}
.ak-def{font-size:12px;color:var(--text2);margin-top:2px;}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--bg);border-radius:var(--rl);padding:1.5rem;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{font-size:18px;font-weight:800;margin-bottom:1rem;}
.modal-close{float:right;font-size:20px;cursor:pointer;background:none;border:none;color:var(--text2);}
.form-row{margin-bottom:.85rem;}
.form-row label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:5px;}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:9px 12px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:15px;}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{outline:none;border-color:var(--green);}
.form-row textarea{min-height:90px;resize:vertical;}

/* Story */
.story-text{font-size:16px;line-height:2.1;padding:1rem;background:var(--blue-l);border-radius:var(--r);margin-bottom:1rem;border:1px solid rgba(24,95,165,.15);}
.story-text strong{color:var(--blue-d);}

/* Definitions */
.def-card{background:var(--bg2);border-radius:var(--r);padding:1rem;margin-bottom:1rem;}
.def-word{font-size:30px;font-weight:900;margin-bottom:6px;}
.def-text{font-size:15px;color:var(--text2);line-height:1.6;}

/* Family ask */
.fask-builder{display:flex;flex-wrap:wrap;gap:6px;min-height:50px;padding:10px;border:1.5px dashed var(--border2);border-radius:var(--r);background:var(--bg2);margin-bottom:.9rem;align-items:center;}
.fask-chip{padding:6px 13px;border-radius:18px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.fask-chip:hover{background:var(--blue-d);}
.fask-word-pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.9rem;}
.fask-pchip{padding:6px 13px;border-radius:18px;border:1.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;transition:all .13s;}
.fask-pchip:hover{background:var(--bg2);}

/* Upload area */
.upload-area{border:2px dashed var(--border2);border-radius:var(--r);padding:1.5rem;text-align:center;background:var(--bg2);cursor:pointer;transition:all .13s;}

<script>
// ═══════════════════════════════════════════════
// STORAGE — everything persists in localStorage
// ═══════════════════════════════════════════════
// ── ROBUST LOCAL STORAGE + AUTO-BACKUP ──
function ls(k,d){
  try{
    const v=localStorage.getItem('terapia_'+k);
    return v?JSON.parse(v):d;
  }catch{return d;}
}
function lsSet(k,v){
  try{
    localStorage.setItem('terapia_'+k,JSON.stringify(v));
    // Also update sessionStorage as backup
    sessionStorage.setItem('terapia_'+k,JSON.stringify(v));
  }catch(e){
    // localStorage full — try clearing old cache entries
    try{
      const keys=Object.keys(localStorage).filter(k=>k.startsWith('terapia_'));
      if(keys.length>50){ localStorage.removeItem(keys[0]); }
      localStorage.setItem('terapia_'+k,JSON.stringify(v));
    }catch{}
  }
}
// Recover from sessionStorage if localStorage fails
function lsRecover(k,d){
  try{
    const v=localStorage.getItem('terapia_'+k)||sessionStorage.getItem('terapia_'+k);
    return v?JSON.parse(v):d;
  }catch{return d;}
}

// ═══════════════════════════════════════════════
// GLOBAL STATE
// ═══════════════════════════════════════════════
let CUR='home', MODE='patient', DIFF=1;
let score=ls('score',0), streak=ls('streak',0), done=ls('done',0);
let qIdx=0, answered=false, sentBuilt=[], faskBuilt=[];
let recMediaRecorder=null, recChunks=[], recTarget=null;

// Per-word accuracy tracking
let wordStats=ls('wordStats',{}); // {word: {correct:n,wrong:n}}
// Per-module accuracy
let modStats=ls('modStats',{}); // {module: {correct:n,wrong:n}}
// Writing grades
let writeGrades=ls('writeGrades',[]); // [{prompt,grade,ts}]
// Custom vocab
let customVocab=ls('customVocab',[]); // [{w,e,p,en,audioDataUrl,imgDataUrl,cat:'custom'}]
// Custom stories
let customStories=ls('customStories',[]); // [{title,text,qs:[{q,opts:[],ans}]}]
// Custom audio overrides
let audioOverrides=ls('audioOverrides',{}); // {word: dataUrl}
// Custom image overrides  
let imgOverrides=ls('imgOverrides',{}); // {word: dataUrl}
// Edit overrides for words/sentences
let textOverrides=ls('textOverrides',{}); // {key: newText}

// ── SAVE: localStorage for small data, IndexedDB for media ──
let _idb=null;
function openIDB(){
  return new Promise(resolve=>{
    if(_idb){resolve(_idb);return;}
    const req=indexedDB.open('TerapiaDB',1);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('media')) db.createObjectStore('media');
    };
    req.onsuccess=e=>{_idb=e.target.result;resolve(_idb);};
    req.onerror=()=>resolve(null);
  });
}
async function idbSet(key,val){
  try{
    const db=await openIDB(); if(!db)return;
    const tx=db.transaction('media','readwrite');
    tx.objectStore('media').put(val,key);
  }catch{}
}
async function idbGet(key){
  try{
    const db=await openIDB(); if(!db)return null;
    return new Promise(resolve=>{
      const tx=db.transaction('media','readonly');
      const req=tx.objectStore('media').get(key);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>resolve(null);
    });
  }catch{return null;}
}
async function idbGetAll(){
  try{
    const db=await openIDB(); if(!db)return {};
    return new Promise(resolve=>{
      const tx=db.transaction('media','readonly');
      const req=tx.objectStore('media').getAll();
      const keyReq=tx.objectStore('media').getAllKeys();
      let vals,keys;
      req.onsuccess=()=>{vals=req.result;if(keys){const o={};keys.forEach((k,i)=>o[k]=vals[i]);resolve(o);}};
      keyReq.onsuccess=()=>{keys=keyReq.result;if(vals){const o={};keys.forEach((k,i)=>o[k]=vals[i]);resolve(o);}};
      req.onerror=()=>resolve({});
    });
  }catch{return {};}
}

function save(){
  // Small data → localStorage
  lsSet('score',score); lsSet('streak',streak); lsSet('done',done);
  lsSet('wordStats',wordStats); lsSet('modStats',modStats);
  lsSet('writeGrades',writeGrades);
  lsSet('customSentences',ls('customSentences',[]));
  lsSet('textOverrides',textOverrides);
  lsSet('commBoard',ls('commBoard',null));
  lsSet('diff',DIFF);
  // Custom vocab metadata (without large media data — those go to IDB)
  const vocabMeta=customVocab.map(v=>({...v,imgDataUrl:null}));
  lsSet('customVocabMeta',vocabMeta);
  lsSet('customStoriesMeta',customStories.map(s=>({...s})));
  // Large media → IndexedDB
  Object.entries(audioOverrides).forEach(([k,v])=>idbSet('audio_'+k,v));
  Object.entries(imgOverrides).forEach(([k,v])=>idbSet('img_'+k,v));
  customVocab.forEach((v,i)=>{if(v.imgDataUrl)idbSet('cv_img_'+i,v.imgDataUrl);});
}

// Load media from IDB on startup
async function loadMediaFromIDB(){
  const all=await idbGetAll();
  Object.entries(all).forEach(([k,v])=>{
    if(k.startsWith('audio_')) audioOverrides[k.slice(6)]=v;
    if(k.startsWith('img_')) imgOverrides[k.slice(4)]=v;
  });
}

function updateHUD(){
  document.getElementById('s-pts').textContent=score;
  document.getElementById('s-str').textContent=streak;
  document.getElementById('s-done').textContent=done;
}

// ═══════════════════════════════════════════════
// SPEECH
// ═══════════════════════════════════════════════
async function speak(text){
  // Check for custom audio override
  const ov=audioOverrides[text];
  if(ov){
    const audio=new Audio(ov);
    audio.play().catch(()=>{});
    return;
  }
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='es-MX'; u.rate=0.78; u.pitch=1.05;
  // prefer es-MX voice
  const voices=window.speechSynthesis.getVoices();
  const mxv=voices.find(v=>v.lang==='es-MX')||voices.find(v=>v.lang.startsWith('es'))||null;
  if(mxv) u.voice=mxv;
  window.speechSynthesis.speak(u);
}
// Ensure voices loaded
window.speechSynthesis.onvoiceschanged=()=>{};

// ═══════════════════════════════════════════════
// RECORDING
// ═══════════════════════════════════════════════
// ── AUDIO RECORDING + UPLOAD FALLBACK ──
// iOS Chrome blocks mic entirely — must use Safari OR file upload
// iOS Safari needs the page to be served from https OR localhost
// Best workaround for local HTML files: use file upload (Voice Memos)

function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function isIOSChrome(){ return isIOS() && /CriOS/.test(navigator.userAgent); }
function isSafari(){ return /^((?!chrome|android).)*safari/i.test(navigator.userAgent); }

function getBestAudioFormat(){
  if(!window.MediaRecorder) return null;
  const formats=[
    'audio/mp4',
    'audio/aac',
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus',
    'audio/ogg',
  ];
  for(const f of formats){
    try{ if(MediaRecorder.isTypeSupported(f)) return f; }catch(e){}
  }
  return null;
}

// Check if recording is likely to work before trying
function canRecord(){
  if(!window.MediaRecorder) return false;
  if(isIOSChrome()) return false; // Chrome on iPhone — blocked by Apple
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  // Local file:// protocol blocks mic in most browsers except Firefox
  if(location.protocol==='file:' && !isIOS() && !isSafari()) return false;
  return true;
}

async function startRec(targetKey, btnEl){
  if(recMediaRecorder && recMediaRecorder.state==='recording'){
    recMediaRecorder.stop();
    if(btnEl){ btnEl.classList.remove('recording'); btnEl.textContent='🎙️ Grabar voz'; }
    return;
  }
  if(!canRecord()){
    // Show file upload fallback immediately
    showAudioUploadFallback(targetKey);
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[];
    const fmt = getBestAudioFormat();
    let recorder;
    try{ recorder = fmt ? new MediaRecorder(stream,{mimeType:fmt}) : new MediaRecorder(stream); }
    catch(e){ recorder = new MediaRecorder(stream); }
    const actualType = recorder.mimeType || fmt || 'audio/webm';
    recorder.ondataavailable=e=>{if(e.data&&e.data.size>0) recChunks.push(e.data);};
    recorder.onstop=()=>{
      const blob=new Blob(recChunks,{type:actualType});
      const reader=new FileReader();
      reader.onload=()=>{
        audioOverrides[targetKey]=reader.result;
        save();
        showToast('✅ Voz guardada');
        if(btnEl){ btnEl.classList.remove('recording'); btnEl.textContent='🎙️ Grabar voz'; }
        const tb=document.getElementById('rec-test-btn');
        if(tb){ tb.style.display='inline-flex'; tb.onclick=()=>new Audio(reader.result).play(); }
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t=>t.stop());
    };
    recMediaRecorder=recorder;
    recorder.start(100);
    if(btnEl){ btnEl.classList.add('recording'); btnEl.textContent='⏹️ Detener'; }
    recTarget=targetKey;
    showToast('🔴 Grabando...');
  }catch(e){
    console.error('Mic error:', e.name, e.message);
    // Any error → show upload fallback
    showAudioUploadFallback(targetKey, e.name);
  }
}

function showAudioUploadFallback(targetKey, errorName){
  const isChromeiOS = isIOSChrome();
  const isFileProto = location.protocol==='file:';
  let reason = '';
  if(isChromeiOS){
    reason = '<strong>Chrome en iPhone</strong> no puede grabar audio — Apple lo bloquea. Usa Safari para grabar, o sube un archivo de voz.';
  } else if(errorName==='NotAllowedError'){
    reason = 'Se negó el permiso del micrófono. Puedes subir un archivo de audio grabado en otra app.';
  } else if(isFileProto){
    reason = 'Los archivos locales no pueden acceder al micrófono en este navegador. Sube un archivo de audio.';
  } else {
    reason = 'No se pudo acceder al micrófono. Sube un archivo de audio grabado con la app de Notas de Voz.';
  }
  openModal(`
    <h3>🎙️ Guardar voz para: <em>${targetKey}</em></h3>
    <div style="padding:12px;background:var(--amber-l);border-radius:var(--r);border-left:4px solid var(--amber);font-size:15px;color:var(--amber-d);margin-bottom:1rem;line-height:1.6;">
      ${reason}
    </div>

    <div style="font-size:15px;font-weight:800;margin-bottom:.6rem;">Opción 1 — Subir archivo de audio</div>
    <div style="font-size:14px;color:var(--text2);margin-bottom:.75rem;line-height:1.7;">
      📱 <strong>iPhone:</strong> Abre la app <strong>Notas de Voz</strong> → graba → comparte → Guardar en Archivos → súbelo aquí.<br>
      🤖 <strong>Android:</strong> Graba con Grabadora → guarda el .m4a o .mp3 → súbelo aquí.
    </div>
    <div class="upload-area" onclick="document.getElementById('audio-file-input').click()" style="margin-bottom:1rem;">

function handleAudioFileUpload(targetKey, input){
  const file = input.files[0];
  if(!file){ showToast('No se seleccionó archivo'); return; }
  const maxMB = 5;
  if(file.size > maxMB*1024*1024){ showToast('El archivo es muy grande. Máximo 5MB.'); return; }
  const reader = new FileReader();
  reader.onload=()=>{
    audioOverrides[targetKey] = reader.result;
    save();
    showToast('✅ Audio guardado para: "'+targetKey+'"');
    closeModal();
    // Test playback
    setTimeout(()=>{
      if(confirm('¿Quieres escuchar el audio guardado?')){
        new Audio(reader.result).play();
      }
    }, 300);
  };
  reader.onerror=()=>showToast('❌ Error al leer el archivo');
  reader.readAsDataURL(file);
}

function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function pick(arr,n){return shuffle(arr).slice(0,n);}

// Safe distractors: never pick words that share a meaning with the correct answer
// We track a "semantic group" for ambiguous words
const SEMANTIC_GROUPS=[
  ['linda','bonita','hermosa','bella','guapa'], // pretty / beautiful names
  ['grande','enorme','gigante','inmenso'],
  ['pequeño','chico','diminuto','mínimo'],
  ['rápido','veloz','ligero'],
  ['lento','despacio','tranquilo'], // note: tranquilo also means calm
  ['triste','deprimido','melancólico'],
  ['feliz','contento','alegre'],
  ['cansado','agotado','fatigado'],
  ['feo','horrible','terrible'],
  ['malo','terrible','pésimo'],
  ['bueno','genial','excelente'],
];
function sameGroup(a,b){
  const ag=a.toLowerCase(), bg=b.toLowerCase();
  return SEMANTIC_GROUPS.some(g=>g.includes(ag)&&g.includes(bg));
}

function safeDistractors(correct, pool, n=3){
  const filtered=pool.filter(v=>{
    if(v.w===correct.w) return false;
    if(sameGroup(v.w, correct.w)) return false;
    if(v.en && correct.en && v.en===correct.en) return false;
    return true;
  });
  return pick(filtered, n);
}

// Randomize positions (never same position twice in a row for correct answer)
let lastCorrectIdx=-1;
function randomizeChoices(correct, distractors){
  const all=[correct,...distractors];
  let tries=0;
  let sh;
  do {
    sh=shuffle(all);
    tries++;
  } while(tries<10 && sh[lastCorrectIdx%sh.length]===correct);
  lastCorrectIdx=sh.indexOf(correct);
  return sh;
}

// Get display image for a vocab item
function getImg(v){
  if(imgOverrides[v.w]) return `<img src="${imgOverrides[v.w]}" alt="${v.w}">`;
  if(v.imgDataUrl) return `<img src="${v.imgDataUrl}" alt="${v.w}">`;
  return v.e||'❓';
}

// Get text override
function getText(key, def){return textOverrides[key]||def;}

// Record correct/wrong
function recordAnswer(word, isCorrect, module){
  if(!wordStats[word]) wordStats[word]={c:0,w:0};
  if(isCorrect) wordStats[word].c++; else wordStats[word].w++;
  if(!modStats[module]) modStats[module]={c:0,w:0};
  if(isCorrect) modStats[module].c++; else modStats[module].w++;
  if(isCorrect){score+=10;streak++;done++;}else{streak=0;done++;}
  answered=true;
  save();
  updateHUD();
}

// ═══════════════════════════════════════════════
// DIFFICULTY-AWARE DISTRACTOR SELECTION
// Diff 1: very different words
// Diff 2: same category
// Diff 3: very similar (e.g. mano vs brazo vs dedo)
// ═══════════════════════════════════════════════
function getDifficultDistractors(correct, pool){
  const safePool=pool.filter(v=>v.w!==correct.w && !sameGroup(v.w,correct.w));
  if(DIFF===1){
    // pick from different categories if possible
    const diffCat=safePool.filter(v=>v.cat!==correct.cat);
    const same=safePool.filter(v=>v.cat===correct.cat);
    const r=[...pick(diffCat,2),...pick(same,1)];
    return r.length>=3?r.slice(0,3):pick(safePool,3);
  } else if(DIFF===2){
    // same category preferred
    const sameCat=safePool.filter(v=>v.cat===correct.cat);
    if(sameCat.length>=3) return pick(sameCat,3);
    return pick(safePool,3);
  } else {
    // hard: same category, short words, very similar
    const sameCat=safePool.filter(v=>v.cat===correct.cat);
    const sorted=sameCat.sort((a,b)=>Math.abs(a.w.length-correct.w.length)-Math.abs(b.w.length-correct.w.length));
    if(sorted.length>=3) return sorted.slice(0,3);
    return pick(safePool,3);
  }
}

// Add custom vocab to all pools
function allVocab(){
  const all=[];
  Object.values(VOCAB).forEach(arr=>all.push(...arr));
  all.push(...customVocab);
  return all;
}
function poolFor(cats){
  const base=[];
  cats.forEach(c=>{if(VOCAB[c]) base.push(...VOCAB[c]);});
  base.push(...customVocab);
  return base;
}

// MODAL SYSTEM
// ═══════════════════════════════════════════════
function openModal(html){
  const bg=document.getElementById('modal-bg');
  bg.innerHTML=`<div class="modal"><button class="modal-close" onclick="closeModal()">✕</button>${html}</div>`;
  bg.style.display='flex';
}
function closeModal(e){
  if(!e||e.target===document.getElementById('modal-bg')){
    document.getElementById('modal-bg').style.display='none';
  }
}

// Edit text override
function editText(key, currentVal, label, callback){
  openModal(`
    <h3>✏️ Editar: ${label}</h3>
    <div class="form-row"><label>Texto en español (México)</label>
    <input id="edit-input" value="${currentVal}" placeholder="${currentVal}"></div>
    <button class="btn btn-g" onclick="
      const v=document.getElementById('edit-input').value.trim();
      if(v){textOverrides['${key}']=v;save();showToast('Guardado');}
      closeModal();
      ${callback||'go(CUR);'}
    ">Guardar</button>
    <button class="btn btn-o" style="margin-left:8px;" onclick="
      delete textOverrides['${key}'];save();showToast('Restaurado');closeModal();${callback||'go(CUR);'}
    ">Restaurar original</button>
  `);
}

// Record audio for a word
function recordForWord(word){
  const hasExisting = !!audioOverrides[word];

function handleAudioUpload(word, input){
  const file = input.files[0]; if(!file)return;
  const reader = new FileReader();
  reader.onload=()=>{
    audioOverrides[word] = reader.result;
    save();
    showToast('✅ Audio guardado para: "'+word+'"');
    closeModal();
  };
  reader.readAsDataURL(file);
}

function handleImgUpload(word, input){

// vImg helper: renders vocab image with edit overlay in family mode
function vImg(v, size=''){
  const img=imgOverrides[v.w]?`<img src="${imgOverrides[v.w]}" alt="${v.w}">`:(v.imgDataUrl?`<img src="${v.imgDataUrl}" alt="${v.w}">`:v.e||'❓');

// Evidence: Albert 1973, Norton 2009, Zumbansen 2014
// Best for: Broca's/non-fluent aphasia with some comprehension
// Method: Sing phrases with left-hand tapping → gradually move to speech

const MIT_PHRASES=[

  {es:"Tengo mucho frío",syl:5,notes:[294,330,330,310,262]},

let mitIdx=0, mitPhase=0, mitTaps=0, mitAudio=null;
function renderMIT(){
  const p=MIT_PHRASES[mitIdx%MIT_PHRASES.length];

    <div class="btn-row" style="margin-top:1rem;">
      <button class="btn btn-o" onclick="mitPhase=Math.max(0,mitPhase-1);renderMIT()">◀ Fase anterior</button>
      <button class="btn btn-g" onclick="mitIdx++;mitPhase=0;mitTaps=0;renderMIT()">Siguiente frase ▶</button>
    </div>
  </div>`);
}
function playMIT(){
  const p=MIT_PHRASES[mitIdx%MIT_PHRASES.length];
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const dur=0.5, gap=0.08;
    p.notes.forEach((freq,i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value=freq; osc.type='sine';
      gain.gain.setValueAtTime(0,ctx.currentTime+i*(dur+gap));
      gain.gain.linearRampToValueAtTime(0.3,ctx.currentTime+i*(dur+gap)+0.05);
      gain.gain.linearRampToValueAtTime(0,ctx.currentTime+i*(dur+gap)+dur);
      osc.start(ctx.currentTime+i*(dur+gap));
      osc.stop(ctx.currentTime+i*(dur+gap)+dur+0.1);
    });
    // Speak after melody
    const totalDur=p.notes.length*(dur+gap)*1000+500;
    setTimeout(()=>speak(p.es), totalDur);
  }catch(e){
    speak(p.es);
  }
}
function tapCount(){
  mitTaps++;
  const el=document.getElementById('mit-taps');
  if(el) el.textContent=mitTaps;
  const msgs=['','¡Un toque!','','','','¡Bien! Sigue tocando','','','','','🎉 ¡Excelente ritmo!'];
  const msg=document.getElementById('mit-msg');
  if(msg) msg.textContent=msgs[Math.min(mitTaps,msgs.length-1)]||'';
  if(mitTaps>=p.syl&&mitTaps%3===0){score+=5;save();updateHUD();}
}

function startFluency(){

const SEQUENCES=[

  {title:'Tomar medicina',steps:['Ver la medicina 💊','Tomar un vaso de agua 💧','Abrir el frasco 🔓','Sacar la pastilla 💊','Tomarla con agua 🥤','Cerrar el frasco 🔒'],tr:'Steps to take medicine'},
  {title:'Ir al baño',steps:['Sentir necesidad 🚽','Levantarse 🧍','Caminar al baño 🚶','Entrar al baño 🚪','Hacer lo necesario ✅','Lavarse las manos 🧼'],tr:'Steps to use the bathroom'},
  {title:'Buenos días',steps:['Despertarse 😴','Abrir los ojos 👁️','Levantarse de la cama 🛏️','Ir al baño 🚽','Lavarse la cara 💧','Desayunar ☕'],tr:'Morning routine'},
];
let seqIdx=0;
function renderSequence(){
  const s=SEQUENCES[seqIdx%SEQUENCES.length];
  const shuffled=shuffle([...s.steps]);
  window._seq={s,shuffled,order:[],placed:new Array(s.steps.length).fill(false)};
  setContent(`
  <div class="card">
    <div class="card-t">📋 Ordenar los pasos</div>
    <div class="card-s">Toca los pasos en el orden correcto. Esto ayuda con la memoria y el pensamiento.</div>
    <div class="instr">Toca cada paso en el orden correcto del 1 al ${s.steps.length}.</div>
    <div style="font-size:20px;font-weight:900;text-align:center;margin-bottom:1rem;color:var(--amber-d);">${s.title}</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:1rem;padding:10px;background:var(--bg2);border-radius:var(--r);min-height:60px;" id="seq-order">
      <div style="font-size:13px;color:var(--text3);font-weight:700;">Tu orden:</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      ${shuffled.map((step,i)=>`<button class="ch" id="ss${i}" onclick="addSeqStep(${i},'${step.replace(/'/g,"\\'")}','${s.steps.indexOf(step)}')" style="font-size:15px;text-align:left;padding:12px 10px;">${step}</button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <div class="btn-row" style="margin-top:1rem;">
      <button class="btn btn-o" onclick="checkSeq()">✓ Verificar</button>
      <button class="btn btn-o" onclick="window._seq.order=[];window._seq.placed.fill(false);renderSequence()">↺ Reiniciar</button>
      <button class="btn btn-g" onclick="seqIdx++;renderSequence()">Siguiente ▶</button>
    </div>
  </div>`);
}
function addSeqStep(i,step,origIdx){
  const {s,order,placed}=window._seq;
  if(placed[i])return;
  placed[i]=true; order.push({step,origIdx:parseInt(origIdx),btnIdx:i});
  speak(step.replace(/[^\w\s]/g,''));
  const btn=document.getElementById('ss'+i);
  if(btn){btn.style.background='var(--amber-l)';btn.style.borderColor='var(--amber)';btn.disabled=true;}
  const ord=document.getElementById('seq-order');
  if(ord){
    const chip=document.createElement('div');
    chip.style.cssText='padding:8px 12px;background:var(--amber);color:#fff;border-radius:8px;font-size:15px;font-weight:700;';
    chip.textContent=order.length+'. '+step;
    ord.appendChild(chip);
  }
}
function checkSeq(){
  const {s,order}=window._seq;
  if(order.length<s.steps.length){showFb(false,'Agrega todos los pasos primero','sequence');return;}
  const isCorrect=order.every((item,i)=>item.origIdx===i);
  if(isCorrect){
    showFb(true,'¡Orden correcto! ¡Excelente!','sequence');
  }else{
    const fb=document.getElementById('fb');
    if(fb){fb.className='fb bad';fb.style.display='block';fb.textContent='No está en orden. El orden correcto es:\n'+s.steps.map((st,i)=>(i+1)+'. '+st).join(' → ');}
    score=Math.max(0,score-5);
  }
}

// ─── 3. REPETITION DRILL — 5x method ───────────
// Tactus research: 5 repetitions rebuilds phonological pathways
let _repPool=[], repCount=0;
function renderRepetition(){
  if(!_repPool.length) _repPool=shuffle([...VOCAB.survival,...VOCAB.body,...VOCAB.food,...VOCAB.home,...customVocab]);
  const v=_repPool[qIdx%_repPool.length];
  repCount=0;
  window._rep={v};
  setContent(`
  <div class="card">
    <div class="card-t">🔁 Repetir 5 veces</div>
    <div class="card-s">Escucha la palabra. Di la palabra en voz alta 5 veces seguidas.</div>
    <div class="instr">Escucha → repite → toca ✓ cada vez que dices la palabra. Meta: 5 veces seguidas.</div>
    <div class="prog"><div class="prog-f" style="width:${((qIdx%_repPool.length)+1)/_repPool.length*100}%"></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:1rem;margin:1.5rem 0;">
      <div onclick="speak('${v.w}')" style="width:180px;height:160px;border-radius:16px;background:var(--bg-warm);border:3px solid var(--amber);display:flex;align-items:center;justify-content:center;font-size:90px;cursor:pointer;box-shadow:var(--shadow-card);overflow:hidden;">
        ${imgOverrides[v.w]?`<img src="${imgOverrides[v.w]}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">`:(v.imgDataUrl?`<img src="${v.imgDataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">`:v.e||'❓')}
      </div>
      <div style="font-size:38px;font-weight:900;">${v.w}</div>
      <div style="font-size:16px;color:var(--text3);">${v.p}</div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin-bottom:1rem;">
      ${[1,2,3,4,5].map(n=>`<div id="dot${n}" style="width:50px;height:50px;border-radius:50%;border:3px solid var(--border2);background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:var(--text3);transition:all .3s;">${n}</div>`).join('')}
    </div>

      <button class="btn btn-g btn-xl" onclick="speak('${v.w}')">🔊 Escuchar</button>

    <div class="btn-row" style="margin-top:1rem;">
      <button class="next-btn" id="nb2" onclick="qIdx++;repCount=0;_repPool=[];answered=false;renderRepetition()">Siguiente ▶</button>
    </div>
  </div>`);

}
function countRep(){
  repCount=Math.min(repCount+1,5);
  for(let n=1;n<=5;n++){const d=document.getElementById('dot'+n);if(d&&n<=repCount){d.style.background='var(--green)';d.style.borderColor='var(--green)';d.style.color='#fff';}}
  const msgs=['','¡Una vez!','¡Dos veces!','¡Tres veces!','¡Cuatro! ¡Ya casi!','🎉 ¡Cinco veces! ¡Muy bien!'];
  const msg=document.getElementById('rep-msg');if(msg) msg.textContent=msgs[repCount]||'';
  if(repCount>=5){score+=20;streak++;done++;save();updateHUD();const nb=document.getElementById('nb2');if(nb)nb.classList.add('show');speak(window._rep.v.w);}
  else speak(window._rep.v.w);
}

// ─── 4. SPACED RETRIEVAL ───────────────────────
// Constant Therapy method: see→hide→recall after delay
const SR_DELAYS=[2,5,10,20,30];
let srRound=0, _srPool=[];
function renderSpacedRetrieval(){
  if(!_srPool.length) _srPool=shuffle([...VOCAB.survival,...VOCAB.food,...VOCAB.body,...VOCAB.home,...customVocab]);
  const v=_srPool[qIdx%_srPool.length];
  const delay=SR_DELAYS[Math.min(srRound,SR_DELAYS.length-1)];
  window._sr={v,delay};
  setContent(`
  <div class="card">
    <div class="card-t">⏱️ Recordar después</div>
    <div class="card-s">Aprende la palabra. Luego la vas a recordar después de ${delay} segundos.</div>
    <div class="instr">Mira y aprende la palabra. Toca "Listo" cuando la sepas. Luego elige la respuesta correcta.</div>
    <div class="prog"><div class="prog-f" style="width:${((qIdx%_srPool.length)+1)/_srPool.length*100}%"></div></div>
    <div id="sr-study" style="display:flex;flex-direction:column;align-items:center;gap:1rem;margin:1.5rem 0;">
      <div onclick="speak('${v.w}')" style="width:180px;height:160px;border-radius:16px;background:var(--bg-warm);border:3px solid var(--amber);display:flex;align-items:center;justify-content:center;font-size:90px;cursor:pointer;overflow:hidden;box-shadow:var(--shadow-card);">
        ${imgOverrides[v.w]?`<img src="${imgOverrides[v.w]}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">`:(v.imgDataUrl?`<img src="${v.imgDataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">`:v.e||'❓')}
      </div>
      <div style="font-size:38px;font-weight:900;">${v.w}</div>
      <div style="font-size:16px;color:var(--text3);">${v.p}</div>
      <button class="btn btn-g" onclick="speak('${v.w}')">🔊 Escuchar</button>
    </div>
    <div class="btn-row"><button class="btn btn-a" onclick="startSR()">Listo — ¡Pruébame! ⏱️</button></div>
    <div id="sr-count" style="display:none;text-align:center;margin:1rem 0;">
      <div style="font-size:64px;font-weight:900;color:var(--amber);" id="sr-num">-</div>
      <div style="font-size:16px;color:var(--text3);">Recuerda la palabra...</div>
    </div>
    <div id="sr-test" style="display:none;">
      <div style="text-align:center;font-size:70px;margin:1rem 0;" id="sr-img"></div>
      <div style="font-size:18px;font-weight:700;text-align:center;margin-bottom:1rem;">¿Cuál era la palabra?</div>
      <div class="g4" id="sr-ch"></div>
      <div class="fb" id="fb"></div>
      <div class="btn-row"><button class="next-btn" id="nb2" onclick="qIdx++;srRound++;_srPool=[];answered=false;renderSpacedRetrieval()">Siguiente ▶</button></div>
    </div>
  </div>`);
  setTimeout(()=>speak(v.w),500);
}
function startSR(){
  const {v,delay}=window._sr;
  document.getElementById('sr-study').style.display='none';
  document.getElementById('sr-study').nextElementSibling.style.display='none'; // hide listo btn
  const cd=document.getElementById('sr-count'); cd.style.display='block';
  let t=delay; document.getElementById('sr-num').textContent=t;
  const iv=setInterval(()=>{t--;const el=document.getElementById('sr-num');if(el)el.textContent=t>0?t:'¡Ahora!';if(t<=0){clearInterval(iv);setTimeout(showSRTest,700);}},1000);
}
function showSRTest(){
  const {v}=window._sr;
  document.getElementById('sr-count').style.display='none';
  const t=document.getElementById('sr-test'); t.style.display='block';
  const imgEl=document.getElementById('sr-img');
  if(imgEl){if(imgOverrides[v.w])imgEl.innerHTML=`<img src="${imgOverrides[v.w]}" style="width:120px;height:100px;object-fit:cover;border-radius:12px;">`;else if(v.imgDataUrl)imgEl.innerHTML=`<img src="${v.imgDataUrl}" style="width:120px;height:100px;object-fit:cover;border-radius:12px;">`;else imgEl.textContent=v.e||'❓';}
  const pool=[...VOCAB.survival,...VOCAB.food,...VOCAB.body,...VOCAB.home,...customVocab];
  const choices=randomizeChoices(v,safeDistractors(v,pool,3));
  const ch=document.getElementById('sr-ch');
  if(ch) ch.innerHTML=choices.map((c,i)=>`<button class="ch" id="src${i}" onclick="checkSR(${i},'${c.w}','${v.w}',${choices.length})">${c.w}</button>`).join('');
}
function checkSR(i,word,correct,n){
  if(answered)return;
  for(let j=0;j<n;j++){const el=document.getElementById('src'+j);if(el){const w=el.textContent.trim();if(w===correct)el.classList.add('correct');else if(j===i)el.classList.add('wrong');el.disabled=true;}}
  speak(word);showFb(word===correct,correct,'spaced');
}

// ─── 5. WORD MATCH — 2 to 6 choices ────────────
// Comprehension Therapy: start 2 choices, scale to 6
let matchDiff=2;
function renderWordMatch(){
  const pool=poolFor(['survival','food','body','home','emotions']);
  const correct=pool[qIdx%pool.length];
  const n=Math.min(matchDiff,pool.length);
  const dist=getDifficultDistractors(correct,pool).slice(0,n-1);
  const choices=randomizeChoices(correct,dist);
  window._wm={correct,choices};
  setContent(`
  <div class="card">
    <div class="card-t">🎯 Escuchar y señalar</div>
    <div class="card-s">Escucha la palabra. Toca la imagen correcta.</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap;">
      <span style="font-size:14px;font-weight:700;color:var(--text3);">Opciones:</span>
      ${[2,3,4,6].map(x=>`<button class="tab ${matchDiff===x?'active':''}" onclick="matchDiff=${x};renderWordMatch()">${x}</button>`).join('')}
    </div>
    <div class="prog"><div class="prog-f" style="width:${((qIdx%pool.length)+1)/pool.length*100}%"></div></div>
    <div class="fb" id="fb"></div>
    <div style="text-align:center;margin-bottom:1.25rem;">
      <button class="btn btn-g" style="font-size:22px;padding:16px 32px;" onclick="speak('${correct.w}')">🔊 ${getText('w_'+correct.w,correct.w)}</button>
    </div>
    <div style="display:grid;grid-template-columns:${n<=2?'1fr 1fr':n<=4?'1fr 1fr':'1fr 1fr 1fr'};gap:12px;" id="wmc">
      ${choices.map((v,i)=>`<div onclick="checkWM(${i})" id="wmc${i}" style="border-radius:14px;border:2.5px solid var(--border2);background:var(--bg);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:10px;transition:all .15s;box-shadow:var(--shadow);min-height:${n<=2?'160':'110'}px;justify-content:center;">
        <div style="font-size:${imgOverrides[v.w]||v.imgDataUrl?'':'60'}px;width:100%;height:${n<=2?'130':'90'}px;display:flex;align-items:center;justify-content:center;border-radius:10px;overflow:hidden;background:var(--bg-warm);">
          ${imgOverrides[v.w]?`<img src="${imgOverrides[v.w]}" style="width:100%;height:100%;object-fit:cover;">`:(v.imgDataUrl?`<img src="${v.imgDataUrl}" style="width:100%;height:100%;object-fit:cover;">`:v.e||'❓')}
        </div>
      </div>`).join('')}
    </div>
    <div style="text-align:center;"><button class="next-btn" id="nb2" onclick="qIdx++;answered=false;renderWordMatch()">Siguiente ▶</button></div>
  </div>`);
  setTimeout(()=>speak(correct.w),600);
}
function checkWM(i){
  if(answered)return;
  const {correct,choices}=window._wm;
  choices.forEach((v,j)=>{const el=document.getElementById('wmc'+j);if(!el)return;if(v.w===correct.w){el.style.background='var(--green-l)';el.style.borderColor='var(--green)';}else if(j===i){el.style.background='var(--red-l)';el.style.borderColor='var(--red)';}el.style.pointerEvents='none';});
  showFb(choices[i].w===correct.w,correct.w,'wordmatch');speak(correct.w);
}

// ─── 6. FIRST LETTER CUE ───────────────────────
// Phonemic cueing — van Hees 2013: highly effective
function renderFirstLetter(){
  const pool=poolFor(['survival','food','body','home','emotions','family']);
  const correct=pool[qIdx%pool.length];
  const fl=correct.w[0].toUpperCase();
  const allL='ABCDEFGHIJLMNOPRSTV'.split('');
  const choices=shuffle([fl,...shuffle(allL.filter(l=>l!==fl)).slice(0,5)]);
  window._fl={correct,fl,choices};
  setContent(`
  <div class="card">
    <div class="card-t">🔤 ¿Con qué letra empieza?</div>
    <div class="card-s">Mira la imagen. Toca la primera letra de la palabra.</div>
    <div class="instr">Esta práctica ayuda al cerebro a recordar cómo suena la palabra.</div>
    <div class="prog"><div class="prog-f" style="width:${((qIdx%pool.length)+1)/pool.length*100}%"></div></div>
    <div class="fb" id="fb"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:1rem;margin:1rem 0;">
      <div onclick="speak('${correct.w}')" style="width:170px;height:150px;border-radius:16px;background:var(--bg-warm);border:3px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:85px;cursor:pointer;overflow:hidden;box-shadow:var(--shadow-card);">
        ${imgOverrides[correct.w]?`<img src="${imgOverrides[correct.w]}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">`:(correct.imgDataUrl?`<img src="${correct.imgDataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">`:correct.e||'❓')}
      </div>
      <div style="font-size:20px;color:var(--text3);font-weight:700;letter-spacing:4px;">${correct.w[0].toUpperCase()} _ _ _ _ _</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
      ${choices.map((l,i)=>`<button class="ch" id="fl${i}" onclick="checkFL(${i},'${l}')" style="font-size:30px;font-weight:900;justify-content:center;">${l}</button>`).join('')}
    </div>
    <div style="text-align:center;"><button class="next-btn" id="nb2" onclick="qIdx++;answered=false;renderFirstLetter()">Siguiente ▶</button></div>
  </div>`);
}
function checkFL(i,letter){
  if(answered)return;
  const {correct,fl,choices}=window._fl;
  choices.forEach((l,j)=>{const el=document.getElementById('fl'+j);if(!el)return;if(l===fl)el.classList.add('correct');else if(j===i)el.classList.add('wrong');el.disabled=true;});
  if(letter===fl) speak(correct.w);
  showFb(letter===fl,correct.w[0].toUpperCase()+' — '+correct.w,'firstletter');
}

function saveSceneList(){ lsSet('sceneList', sceneList); }

function openSceneUpload(){

      <input id="sc-title" placeholder="Ej: La cocina de casa"></div>

}
let _sceneImgData = null;
function previewSceneImg(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    _sceneImgData=reader.result;
    const p=document.getElementById('sc-img-preview');
    if(p){p.src=_sceneImgData;p.style.display='block';}
  };
  reader.readAsDataURL(file);
}
function createScene(){
  const title=document.getElementById('sc-title')?.value?.trim();
  if(!title||!_sceneImgData){showToast('Falta título o imagen');return;}
  const id='sc_'+Date.now();
  sceneList.push({id,title,imgDataUrl:_sceneImgData,spots:[]});
  _sceneImgData=null;
  saveSceneList();
  closeModal();
  openSceneEdit(id);
}
function deleteScene(id){
  if(!confirm('¿Eliminar esta imagen?'))return;
  sceneList=sceneList.filter(s=>s.id!==id);
  saveSceneList(); renderSceneList();
}

// ── SCENE EDIT MODE (family) ──
function openSceneEdit(id){
  sceneEditId=id; sceneEditTool='move'; sceneHistory=[]; sceneRedo=[]; sceneSelected=null;
  const scene=sceneList.find(s=>s.id===id); if(!scene)return;
  renderSceneEditor(scene);
}

function pushHistory(scene){
  sceneHistory.push(JSON.parse(JSON.stringify(scene.spots)));
  if(sceneHistory.length>50) sceneHistory.shift();
  sceneRedo=[];
}

function renderSceneEditor(scene){
  setContent(`
  <div class="card" style="padding:1rem;">

    <!-- TOOLBAR -->
    <div style="display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap;align-items:center;">

      <button id="tool-lock" class="btn ${sceneEditTool==='lock'?'btn-a':'btn-o'}" onclick="setSceneTool('lock')" title="Bloquear — clic en área para bloquear" style="padding:8px 12px;font-size:16px;">🔒</button>
      <button id="tool-unlock" class="btn ${sceneEditTool==='unlock'?'btn-a':'btn-o'}" onclick="setSceneTool('unlock')" title="Desbloquear — clic para desbloquear" style="padding:8px 12px;font-size:16px;">🔓</button>
      <div style="width:1px;height:28px;background:var(--border2);margin:0 2px;"></div>
      <button class="btn btn-o" onclick="sceneUndo()" style="padding:8px 12px;font-size:15px;" title="Deshacer">↩️</button>
      <button class="btn btn-o" onclick="sceneRedo_fn()" style="padding:8px 12px;font-size:15px;" title="Rehacer">↪️</button>
      <div style="width:1px;height:28px;background:var(--border2);margin:0 2px;"></div>
      <button class="btn btn-g" onclick="addSceneSpot()" style="padding:8px 14px;font-size:14px;">➕ Agregar área</button>
    </div>

    <div style="font-size:13px;color:var(--text2);margin-bottom:.5rem;">
      🖱️ = solo clic &nbsp;✥ = mover &nbsp;🔒 = bloquear &nbsp;🔓 = desbloquear &nbsp;— Arrastra las esquinas para cambiar el tamaño
    </div>

    <!-- SCENE CANVAS (image + hotspots) -->
    <div id="scene-wrap" style="position:relative;display:inline-block;width:100%;max-width:680px;">
      <img id="scene-img" src="${scene.imgDataUrl}" style="width:100%;border-radius:var(--r);display:block;user-select:none;" draggable="false">
      <div id="scene-spots"></div>
    </div>

    <!-- SPOT LIST -->
    <div id="spot-list" style="margin-top:1rem;"></div>
  </div>`);

  // Wait for img to load to get dimensions
  const img=document.getElementById('scene-img');
  img.onload=()=>{ renderSceneSpots(scene); renderSpotList(scene); };
  if(img.complete) { renderSceneSpots(scene); renderSpotList(scene); }
}

function setSceneTool(t){
  sceneEditTool=t;
  ['select','move','lock','unlock'].forEach(tool=>{
    const btn=document.getElementById('tool-'+tool);
    if(!btn)return;
    btn.className='btn '+(t===tool?(tool==='lock'||tool==='unlock'?'btn-a':'btn-g'):'btn-o');
  });
}

function renderSceneSpots(scene){
  const wrap=document.getElementById('scene-wrap');
  const img=document.getElementById('scene-img');
  const spotsDiv=document.getElementById('scene-spots');
  if(!wrap||!img||!spotsDiv)return;
  const iw=img.offsetWidth, ih=img.offsetHeight;
  spotsDiv.innerHTML='';
  scene.spots.forEach(spot=>{
    const el=document.createElement('div');
    el.id='spot_'+spot.id;
    const isSelected=sceneSelected===spot.id;
    el.style.cssText=`
      position:absolute;
      left:${spot.x*100}%;top:${spot.y*100}%;
      width:${spot.w*100}%;height:${spot.h*100}%;
      background:${spot.locked?'rgba(255,100,100,0.25)':'rgba(201,122,0,0.25)'};
      border:3px solid ${spot.locked?'#E24B4A':'#C97A00'};
      border-radius:8px;
      cursor:${sceneEditTool==='move'&&!spot.locked?'move':sceneEditTool==='select'?'pointer':'default'};
      display:flex;align-items:center;justify-content:center;
      box-sizing:border-box;
      ${isSelected?'box-shadow:0 0 0 4px rgba(26,140,104,.6);':''}
      user-select:none;
    `;
    // Label
    const lbl=document.createElement('div');
    lbl.style.cssText=`
      font-size:clamp(10px,${spot.w*iw*0.18}px,18px);
      font-weight:900;color:#fff;
      text-shadow:0 1px 4px rgba(0,0,0,.9);
      text-align:center;padding:2px 4px;
      pointer-events:none;
      line-height:1.2;
      max-width:90%;overflow:hidden;word-break:break-word;
    `;
    lbl.textContent=(spot.locked?'🔒 ':'')+spot.label;
    el.appendChild(lbl);
    // Resize handle (bottom-right)
    const handle=document.createElement('div');
    handle.style.cssText=`
      position:absolute;bottom:-6px;right:-6px;width:18px;height:18px;
      background:var(--amber);border-radius:4px;cursor:se-resize;
      border:2px solid #fff;z-index:2;
    `;
    handle.addEventListener('mousedown',e=>startSceneResize(e,spot,img));
    handle.addEventListener('touchstart',e=>startSceneResize(e,spot,img),{passive:false});
    el.appendChild(handle);
    // Click / drag on spot
    el.addEventListener('mousedown',e=>{
      if(e.target===handle)return;
      handleSpotInteraction(e,spot,img,'mouse');
    });
    el.addEventListener('touchstart',e=>{
      if(e.target===handle)return;
      handleSpotInteraction(e,spot,img,'touch');
    },{passive:false});
    spotsDiv.appendChild(el);
  });
}

function handleSpotInteraction(e,spot,img,type){
  e.preventDefault(); e.stopPropagation();
  const scene=sceneList.find(s=>s.id===sceneEditId); if(!scene)return;
  if(sceneEditTool==='lock'){
    pushHistory(scene); spot.locked=true; saveSceneList(); renderSceneSpots(scene); renderSpotList(scene); return;
  }
  if(sceneEditTool==='unlock'){
    pushHistory(scene); spot.locked=false; saveSceneList(); renderSceneSpots(scene); renderSpotList(scene); return;
  }
  sceneSelected=spot.id;
  if(sceneEditTool==='move'&&!spot.locked){
    startSceneDrag(e,spot,img,type);
  } else {
    renderSceneSpots(scene); // just re-render to show selection
  }
}

function getEventXY(e,type){
  if(type==='touch'||e.touches){
    const t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
    return{x:t.clientX,y:t.clientY};
  }
  return{x:e.clientX,y:e.clientY};
}

function startSceneDrag(e,spot,img,type){
  const p=getEventXY(e,type);
  const r=img.getBoundingClientRect();
  const origX=spot.x, origY=spot.y;
  const startX=(p.x-r.left)/r.width, startY=(p.y-r.top)/r.height;
  function onMove(ev){
    const mv=getEventXY(ev,type);
    const dx=(mv.x-r.left)/r.width-startX;
    const dy=(mv.y-r.top)/r.height-startY;
    spot.x=Math.max(0,Math.min(1-spot.w, origX+dx));
    spot.y=Math.max(0,Math.min(1-spot.h, origY+dy));
    renderSceneSpots(sceneList.find(s=>s.id===sceneEditId));
  }
  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('touchend',onUp);
    saveSceneList();
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onUp);
}

function startSceneResize(e,spot,img){
  e.preventDefault(); e.stopPropagation();
  const scene=sceneList.find(s=>s.id===sceneEditId); if(!scene||spot.locked)return;
  pushHistory(scene);
  const type=e.touches?'touch':'mouse';
  const p=getEventXY(e,type);
  const r=img.getBoundingClientRect();
  const origW=spot.w, origH=spot.h;
  const startX=p.x/r.width, startY=p.y/r.height;
  function onMove(ev){
    const mv=getEventXY(ev,type);
    const dx=mv.x/r.width-startX;
    const dy=mv.y/r.height-startY;
    spot.w=Math.max(0.05,Math.min(1-spot.x, origW+dx));
    spot.h=Math.max(0.03,Math.min(1-spot.y, origH+dy));
    renderSceneSpots(sceneList.find(s=>s.id===sceneEditId));
  }
  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('touchend',onUp);
    saveSceneList();
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onUp);
}

function sceneUndo(){
  const scene=sceneList.find(s=>s.id===sceneEditId); if(!scene||!sceneHistory.length)return;
  sceneRedo.push(JSON.parse(JSON.stringify(scene.spots)));
  scene.spots=sceneHistory.pop();
  saveSceneList(); renderSceneSpots(scene); renderSpotList(scene);
  showToast('Deshecho ↩️');

function sceneRedo_fn(){

function selectSpotForEdit(spotId){
  const scene=sceneList.find(s=>s.id===sceneEditId); if(!scene)return;
  sceneSelected = sceneSelected===spotId ? null : spotId;
  renderSceneSpots(scene);
  renderSpotList(scene);
  // Scroll the panel into view
  if(sceneSelected){
    setTimeout(()=>{
      const row=document.getElementById('spotrow_'+spotId);
      if(row) row.scrollIntoView({behavior:'smooth',block:'nearest'});
    },100);
  }
}

function saveInlineLabel(spotId){
  const scene=sceneList.find(s=>s.id===sceneEditId); if(!scene)return;
  const spot=scene.spots.find(sp=>sp.id===spotId); if(!spot)return;
  const input=document.getElementById('inline-label-'+spotId);
  if(!input)return;
  const v=input.value.trim();
  if(!v){showToast('Escribe el nombre');return;}
  pushHistory(scene);
  spot.label=v;
  saveSceneList();
  renderSceneSpots(scene);
  renderSpotList(scene);
  showToast('Nombre guardado ✅');
}

function adjustSpot(spotId, prop, delta){
  const scene=sceneList.find(s=>s.id===sceneEditId); if(!scene)return;
  const spot=scene.spots.find(sp=>sp.id===spotId); if(!spot||spot.locked)return;
  pushHistory(scene);
  if(prop==='w') spot.w = Math.max(0.03, Math.min(1-spot.x, spot.w+delta));
  else if(prop==='h') spot.h = Math.max(0.03, Math.min(1-spot.y, spot.h+delta));
  else if(prop==='x') spot.x = Math.max(0, Math.min(1-spot.w, spot.x+delta));
  else if(prop==='y') spot.y = Math.max(0, Math.min(1-spot.h, spot.y+delta));
  saveSceneList();
  // Update just the number displays + sliders without full re-render (smoother)
  const sw=document.getElementById('sw_'+spotId); if(sw) sw.textContent=Math.round(spot.w*100)+'%';
  const sh=document.getElementById('sh_'+spotId); if(sh) sh.textContent=Math.round(spot.h*100)+'%';
  const sx=document.getElementById('sx_'+spotId); if(sx) sx.textContent=Math.round(spot.x*100)+'%';
  const sy=document.getElementById('sy_'+spotId); if(sy) sy.textContent=Math.round(spot.y*100)+'%';
  renderSceneSpots(scene);
}

function setSpotVal(spotId, prop, val){
  const scene=sceneList.find(s=>s.id===sceneEditId); if(!scene)return;
  const spot=scene.spots.find(sp=>sp.id===spotId); if(!spot||spot.locked)return;
  if(prop==='w') spot.w = Math.max(0.03, Math.min(1-spot.x, parseFloat(val)));
  else if(prop==='h') spot.h = Math.max(0.03, Math.min(1-spot.y, parseFloat(val)));
  else if(prop==='x') spot.x = Math.max(0, Math.min(1-spot.w, parseFloat(val)));
  else if(prop==='y') spot.y = Math.max(0, Math.min(1-spot.h, parseFloat(val)));
  saveSceneList();
  const sw=document.getElementById('sw_'+spotId); if(sw) sw.textContent=Math.round(spot.w*100)+'%';
  const sh=document.getElementById('sh_'+spotId); if(sh) sh.textContent=Math.round(spot.h*100)+'%';
  const sx=document.getElementById('sx_'+spotId); if(sx) sx.textContent=Math.round(spot.x*100)+'%';
  const sy=document.getElementById('sy_'+spotId); if(sy) sy.textContent=Math.round(spot.y*100)+'%';
  renderSceneSpots(scene);
}

function toggleSpotLock(spotId){
  const scene=sceneList.find(s=>s.id===sceneEditId); if(!scene)return;
  const spot=scene.spots.find(sp=>sp.id===spotId); if(!spot)return;
  pushHistory(scene);
  spot.locked=!spot.locked;
  saveSceneList();
  renderSceneSpots(scene);
  renderSpotList(scene);
}

function deleteSpot(spotId){
  const scene=sceneList.find(s=>s.id===sceneEditId); if(!scene)return;
  pushHistory(scene);
  scene.spots=scene.spots.filter(sp=>sp.id!==spotId);
  if(sceneSelected===spotId) sceneSelected=null;
  saveSceneList(); renderSceneSpots(scene); renderSpotList(scene);
}

  const scene=sceneList.find(s=>s.id===id); if(!scene)return;
  setContent(`

  </div>`);

  const img=document.querySelector('#play-wrap img');
  function renderPlaySpots(){
    const spotsDiv=document.getElementById('play-spots'); if(!spotsDiv)return;
    spotsDiv.innerHTML='';
    scene.spots.forEach(spot=>{
      const el=document.createElement('div');
      el.style.cssText=`
        position:absolute;
        left:${spot.x*100}%;top:${spot.y*100}%;
        width:${spot.w*100}%;height:${spot.h*100}%;
        background:rgba(26,140,104,0.18);
        border:3px solid rgba(26,140,104,0.6);
        border-radius:8px;
        cursor:pointer;
        display:flex;align-items:center;justify-content:center;
        box-sizing:border-box;
        transition:all .15s;
        -webkit-tap-highlight-color:transparent;
      `;
      // Patient view: spots are semi-transparent, no labels visible until tapped
      el.addEventListener('click',()=>{
        speak(spot.label);
        el.style.background='rgba(26,140,104,0.5)';
        el.style.borderColor='var(--green)';
        const res=document.getElementById('play-result');
        if(res) res.textContent='✅ '+spot.label;
        setTimeout(()=>{
          el.style.background='rgba(26,140,104,0.18)';
          el.style.borderColor='rgba(26,140,104,0.6)';
        },1500);
        score+=5; done++; save(); updateHUD();
      });
      spotsDiv.appendChild(el);
    });
  }
  img.onload=renderPlaySpots;
  if(img.complete) renderPlaySpots();
}

function renderFinder(){
  setContent(`
  <div class="card">
    <div class="card-t">🔍 ¿Qué quiero decir?</div>
    <div class="card-s">Escribe lo que sientes o necesitas y te ayudo a encontrar la palabra.</div>
    <div class="instr blue">Escribe en español o inglés lo que quieres expresar. Por ejemplo: "me duele", "quiero agua", "estoy triste".</div>
    <input class="ak-input" id="finder-input" placeholder="Escribe aquí..." oninput="runFinder(this.value)">
    <div id="finder-results" style="margin-top:1rem;"></div>
  </div>`);
}
function runFinder(q){
  const area=document.getElementById('finder-results');
  if(!area) return;
  if(!q||q.length<2){area.innerHTML='';return;}
  const q2=q.toLowerCase().trim();
  // Search FINDER_DB + all vocab
  const results=[];
  FINDER_DB.forEach(entry=>{
    if(entry.concept.includes(q2)){
      entry.words.forEach(w=>results.push({w:w.w,e:w.e,context:entry.concept,def:''}));
    }
  });
  // Also search vocab directly
  allVocab().forEach(v=>{
    if(v.w.toLowerCase().includes(q2)||v.en.toLowerCase().includes(q2)){
      results.push({w:v.w,e:v.e||'❓',context:v.en,def:v.p||''});
    }
  });
  // Also search definitions
  DEFINITIONS.forEach(d=>{
    if(d.w.toLowerCase().includes(q2)||d.def.toLowerCase().includes(q2)){
      results.push({w:d.w,e:d.e,context:'definición',def:d.def.substring(0,80)+'...'});
    }
  });
  if(!results.length){area.innerHTML=`<div style="color:var(--text3);text-align:center;padding:1rem;">No encontré nada. Intenta con otra palabra.</div>`;return;}
  const seen=new Set();
  const unique=results.filter(r=>{if(seen.has(r.w))return false;seen.add(r.w);return true;}).slice(0,8);
  area.innerHTML=unique.map(r=>`
    <div class="ak-result" onclick="speak('${r.w}')">
      <div class="ak-emoji">${r.e}</div>
      <div class="ak-text">
        <div class="ak-word">${r.w}</div>
        <div class="ak-def">${r.context}${r.def?' — '+r.def:''}</div>
      </div>
      <button class="btn btn-g" style="padding:6px 12px;font-size:12px;" onclick="event.stopPropagation();speak('${r.w}')">🔊</button>
    </div>`).join('');
}

let _catSel=null;
function renderCategory(){
  const cats=[
    {label:"Comida 🍽️",key:"food",items:shuffle(VOCAB.food).slice(0,3)},
    {label:"Cuerpo 🧑",key:"body",items:shuffle(VOCAB.body).slice(0,3)},

  ];
  const picked=shuffle(cats).slice(0,2);

  window._cat={picked,allItems};
  _catSel=null;
  setContent(`
  <div class="card">
    <div class="card-t">📦 Categorías</div>

    <div class="wpool" id="cat-pool">
      ${allItems.map((v,i)=>`<span class="pchip" id="cp${i}" onclick="selectCatItem(${i})">${v.e} ${getText('w_'+v.w,v.w)}</span>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      ${picked.map((c,ci)=>`
        <div style="background:var(--bg2);border-radius:var(--r);padding:12px;">
          <div style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px;">${c.label}</div>
          <div style="min-height:60px;border:1.5px dashed var(--border2);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;" id="dz${ci}" onclick="placeToCat(${ci})"></div>
        </div>`).join('')}
    </div>
    <div class="btn-row" style="margin-top:1rem;"><button class="btn btn-o" onclick="renderCategory()">Nueva ronda ↺</button></div>
  </div>`);
}
function selectCatItem(i){
  document.querySelectorAll('.pchip').forEach(c=>{c.style.background='';c.style.color='';});
  const el=document.getElementById('cp'+i);
  if(!el||el.style.visibility==='hidden')return;
  el.style.background='var(--green)'; el.style.color='#fff';
  _catSel=i;
  document.getElementById('cat-instr').textContent='Ahora toca la categoría correcta.';
}
function placeToCat(ci){
  if(_catSel===null)return;
  const {picked,allItems}=window._cat;
  const item=allItems[_catSel];
  const isRight=picked[ci].items.some(v=>v.w===item.w);
  const el=document.getElementById('cp'+_catSel);
  const dz=document.getElementById('dz'+ci);
  if(el)el.style.visibility='hidden';
  const chip=document.createElement('span');
  chip.style.cssText=`padding:5px 10px;border-radius:14px;font-size:13px;font-weight:700;background:${isRight?'var(--green-l)':'var(--red-l)'};color:${isRight?'var(--green-deep)':'var(--red-d)'};`;
  chip.textContent=item.e+' '+item.w;
  if(dz)dz.appendChild(chip);
  speak(item.w);
  if(isRight){score+=10;streak++;done++;}else{streak=0;}
  done++;save();updateHUD();
  _catSel=null;
  document.querySelectorAll('.pchip').forEach(c=>{c.style.background='';c.style.color='';});
  document.getElementById('cat-instr').textContent='Toca otra palabra.';
}

function selEmoji(i){
  document.querySelectorAll('#em-col .ch').forEach(b=>b.style.borderColor='');
  const el=document.getElementById('em'+i); if(!el||el.disabled)return;
  el.style.borderColor='var(--green)'; window._match.emojiSel=i; tryMatch2();
}
function selWord(i){
  document.querySelectorAll('#wm-col .ch').forEach(b=>b.style.borderColor='');
  const el=document.getElementById('wm'+i); if(!el||el.disabled)return;
  el.style.borderColor='var(--blue)'; window._match.wordSel=i; tryMatch2();

function tryMatch2(){
  const {emojiSel,wordSel,emojis,items}=window._match;
  if(emojiSel===null||wordSel===null)return;
  const ok=emojis[emojiSel].w===items[wordSel].w;
  speak(items[wordSel].w);
  const ee=document.getElementById('em'+emojiSel), we=document.getElementById('wm'+wordSel);
  if(ok){
    if(ee){ee.classList.add('correct');ee.disabled=true;}
    if(we){we.classList.add('correct');we.disabled=true;}
    score+=10;streak++;done++;
  } else {
    if(ee){ee.style.borderColor='var(--red)';setTimeout(()=>{if(ee)ee.style.borderColor='';},700);}
    if(we){we.style.borderColor='var(--red)';setTimeout(()=>{if(we)we.style.borderColor='';},700);}
    streak=0;
  }
  done++;save();updateHUD();
  window._match.emojiSel=null;window._match.wordSel=null;
}

  choices.forEach((v,j)=>{

}

  document.querySelectorAll('#fb ~ .g2 .ch, .g2 .ch').forEach((el,j)=>{

  // Fix: use index approach

function addSW(w,i){

  const c=document.createElement('span'); c.className='wchip'; c.textContent=w;
  c.onclick=()=>{el.style.visibility='visible';sentBuilt=sentBuilt.filter(x=>!(x.w===w&&x.i===i));c.remove();};
  b.appendChild(c);

function checkStQ(qi,oi,answer,correct,total){
  if(_storyAnswered[qi])return;
  _storyAnswered[qi]=true;
  speak(answer);
  const ok=answer===correct;
  // find all buttons for this question
  for(let j=0;j<total;j++){
    const el=document.getElementById(`sq${qi}_${j}`);
    if(el){
      const thisOpt=el.textContent.trim();
      if(thisOpt===correct)el.classList.add('correct');
      else if(j===oi)el.classList.add('wrong');
      el.disabled=true;
    }
  }
  if(ok){score+=10;streak++;}else{streak=0;}
  done++;save();updateHUD();
}

function wInit(){
  const wrap = document.getElementById('canvas-wrap');
  const canvas = document.getElementById('wcanvas');
  if(!wrap||!canvas) return;

  // Size canvas to fill wrap exactly
  const W = wrap.clientWidth || 500;
  const H = (writeMode==='sentences'||writeMode==='phrases') ? 140 : 220;
  canvas.width  = W;
  canvas.height = H;
  canvas.style.width  = W+'px';
  canvas.style.height = H+'px';
  canvas.style.display = 'block';

  wDraw(canvas);       // draw ruled lines
  wListen(canvas);     // attach pointer events
}

function wDraw(canvas){
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.fillStyle='#FFFEF5';
  ctx.fillRect(0,0,W,H);

  // Ruled lines: top / mid / baseline
  const baseY = Math.round(H*0.72);
  const topY  = Math.round(H*0.22);
  const midY  = Math.round(H*0.47);

  ctx.strokeStyle='rgba(160,160,160,0.35)'; ctx.lineWidth=1; ctx.setLineDash([]);
  [[0,topY],[0,midY]].forEach(([x,y])=>{ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(W,y);ctx.stroke();});
  ctx.strokeStyle='rgba(160,160,160,0.65)'; ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(16,baseY);ctx.lineTo(W-16,baseY);ctx.stroke();
}

function wListen(canvas){
  let drawing=false, lx=0, ly=0;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;

  function pos(e){
    const r=canvas.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return{
      x:(src.clientX-r.left)*(W/r.width),
      y:(src.clientY-r.top)*(H/r.height)
    };
  }
  function down(e){
    e.preventDefault();
    drawing=true;
    const p=pos(e); lx=p.x; ly=p.y;
  }
  function move(e){
    if(!drawing)return;
    e.preventDefault();
    const p=pos(e);
    const col=document.getElementById('pen-color')?.value||'#111111';
    const sz=parseFloat(document.getElementById('pen-size')?.value||8);
    ctx.setLineDash([]);
    ctx.strokeStyle=col; ctx.lineWidth=sz;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke();
    lx=p.x; ly=p.y;
  }
  function up(){ drawing=false; }

  canvas.addEventListener('mousedown',down);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',up);
  canvas.addEventListener('mouseleave',up);
  canvas.addEventListener('touchstart',down,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',up);
}

function wClear(){
  const canvas=document.getElementById('wcanvas');
  if(canvas) wDraw(canvas);
}

      <div style="margin-bottom:.6rem;"><div style="font-size:12px;font-weight:800;color:var(--green-deep);margin-bottom:4px;">✅ Domina (80%+ correctas)</div><div>${knownWords.length?knownWords.map(w=>`<span class="word-chip-sm known">${w}</span>`).join(''):'<span style="color:var(--text3);font-size:13px;">Sigue practicando</span>'}</div></div>
